apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-cert
  namespace: argocd
spec:
  commonName: argocd.cam.lab
  
  # Durée de validité : 1 an (365 jours)
  duration: 8760h 
  
  # Renouvellement automatique 30 jours avant l'expiration
  renewBefore: 720h 
  
  secretName: argocd-tls
  issuerRef:
    name: custom-ca-issuer
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - argocd.cam.lab
